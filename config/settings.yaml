# ============================================================================
# Общие настройки агента-объяснителя САП.
# Агент работает со стендом ТОЛЬКО через пути из этого файла: никаких импортов
# кода стенда. Чтобы перенести агента к другой инсталляции (например к боевому
# bko_planning), достаточно поменять секцию stand.
# ============================================================================

stand:
  root: "../demo_bko"                 # относительно корня sap_agent
  tasks_dir: "data"                   # файлы заданий
  params_dir: "data/params"           # нормативно-справочная информация
  results_dir: "calculation_results"  # результаты расчёта
  logs_dir: "log"                     # логи прогонов
  reglaments_dir: "reglaments"        # технологические регламенты (Word)
  code_dirs: ["demo"]                 # исходный код этапов расчёта
  config_file: "config.yaml"          # конфиг стенда (маппинг колонок, служебные годы)

  # Шаблоны имён: {task_stem} — имя файла задания без расширения
  result_pattern: "demo_schedule_{task_stem}.xlsx"
  log_pattern: "demo_{task_stem}.log"
  default_task: "input_task_1.xlsx"

  # Листы результата расчёта
  sheets:
    all_pp: "Все_ПП"
    stages: {экструзия: "Э", печать: "П", кольцевание: "К"}
    nsi_errors: "Ошибки НСИ"
    logs: "Логи"

  # Псевдо-линии неразмещённых партий (см. demo_bko/README.md).
  # Служебные годы готовности сюда НЕ дублируются: агент читает их из
  # config_file самого стенда. Знание о стенде должно жить в стенде —
  # иначе при переносе на другой стенд его пришлось бы искать по промптам.
  pseudo_lines: ["Без блока", "Отложенные"]

  # Этап → файлы, принимающие решения на этом этапе. Нужны обходу
  # «этап → норма → таблица → код» (memory/traversal.py). При переносе на
  # другой стенд правится здесь, а не в коде.
  stage_code:
    экструзия: ["demo/extrusion.py"]
    печать: ["demo/printing.py"]
    кольцевание: ["demo/ringing.py"]
  # Предобработка и проверки НСИ: параметр, проверенный здесь, в отборе участвует
  shared_code: ["demo/input_data.py"]
  # Выгрузка результата и генератор синтетики: решений не принимают, в разбор
  # расхождений не входят — упоминание параметра в выгрузке не значит, что он
  # участвовал в отборе
  report_only_code: ["demo/output.py", "demo/synth_data.py"]

  # Файлы, которые не индексируются и не читаются никогда
  ignore_globs: ["~$*", "**/~$*", "**/__pycache__/**", "*.pyc"]

# --- Ограничения: защита от dead loop и перерасхода ---------------------------
limits:
  # Маршруту «план и задание → НСИ → регламент» нужно минимум три УСПЕШНЫХ
  # захода, а живые прогоны показали, что один-два уходят на исправление вызова.
  # При трёх итерациях агент упирался в лимит ровно тогда, когда оставалось
  # прочитать норму. Пять — с запасом на две ошибки, дороже примерно на цент.
  max_iterations: 5            # циклов Reason → Act → Observe на один вопрос
  max_tool_calls: 10           # всего вызовов инструментов на один вопрос
  # Маршрут сверки документации с кодом требует минимум двух обращений к памяти:
  # одно за нормой, одно за реализацией. Прогон золотого набора показал, что на
  # двух заходах группа B захлёбывалась: первый уходил на уточнение запроса,
  # и на код обращения уже не оставалось. На четырёх упёрлись снова: честная
  # сверка идёт норма → код по пункту → код по имени функции → код по запросу.
  max_retrieval_queries: 6     # обращений к векторному поиску на один вопрос
  tool_retries: 1              # повторов при временной ошибке инструмента
  llm_retries: 2               # повторов при временной ошибке провайдера модели
  request_timeout_s: 60        # таймаут SDK: считает молчание канала
  # Жёсткий дедлайн на весь запрос. Нужен потому, что таймаут SDK срабатывает
  # только на паузу в передаче: провайдер, который медленно но непрерывно пишет
  # ответ, его не задевает. Живой прогон дал сверку источников длиной 332 с при
  # request_timeout_s: 60 — модель упёрлась в max_tokens и рассуждала до отказа.
  hard_timeout_s: 120
  llm_timeout_retries: 1       # повторов именно после дедлайна (дороже обычных)
  # Эмбеддинги — пакетная работа, а не интерактивный вызов, и таймаут у них
  # должен быть свой. На процессоре bge-m3 кодирует один фрагмент кода за
  # доли секунды, но пачка из 32 уходит В ОДНОМ запросе и последовательно
  # считается на сервере: сборка индекса упиралась в 60 секунд ровно так.
  embed_timeout_s: 300         # на один запрос эмбеддингов (пачка целиком)
  embed_batch: 8               # фрагментов в одном запросе
  embed_retries: 2             # повторов при таймауте или обрыве
  max_cost_usd: 0.50           # потолок стоимости одного прогона
  circuit_breaker_failures: 3  # подряд идущих отказов провайдера до размыкания
  circuit_breaker_cooldown_s: 60
  # Сколько помнить, что конкретной МОДЕЛИ у провайдера сейчас нет. Circuit
  # breaker выше считает отказы по провайдеру целиком и для этого не годится:
  # разомкнуть openrouter из-за одной мёртвой модели значит отключить и живые.
  # Прогон 14.09 сходил за недоступной моделью 47 раз — по разу на каждый ход
  # каждого кейса, потому что клиент создаётся на кейс и ничего не помнил.
  model_unavailable_cooldown_s: 900
  # Дедлайн для починки структурного вывода. Отдельный и намеренно скупой:
  # починка — короткий запрос «повтори по схеме» с готовым ответом в контексте.
  # Прогон 14.09 (кейс A5) отдал 240 с из 517 на две починки, висевшие полный
  # жёсткий дедлайн. Не вернулась быстро — не вернётся полезной.
  repair_timeout_s: 40

# --- Пороги качества ----------------------------------------------------------
thresholds:
  min_confidence: 0.6          # ниже — ответ «причина не подтверждена»
  min_evidence_items: 1        # утверждение без источника в ответ не попадает

# --- Векторная память -----------------------------------------------------
memory:
  # qdrant — основной бэкенд: именованные векторы (плотный + разреженный BM25),
  #          объединение выдач по RRF, фильтры по payload;
  # numpy  — запасной: косинусная близость перебором, без гибридного поиска.
  #          Нужен там, где Qdrant поднять нельзя.
  backend: "${SAP_AGENT_MEMORY_BACKEND:-qdrant}"
  hybrid: true                 # разреженный вектор BM25 рядом с плотным
  store_dir: "memory/store"
  top_k: 6                     # сколько фрагментов возвращает поиск по умолчанию
  min_score: 0.20              # порог плотной близости; у RRF своя шкала,
                               # поэтому решение о релевантности принимается
                               # по косинусу и лексическому попаданию
  include_safety_clauses: false  # пункты про охрану труда и уборку в выдачу не идут
  embedding_dim_fallback: 1024   # размерность запасного лексического эмбеддера
  qdrant:
    # Задан URL — работаем с сервером (доступны индексы по payload).
    # Пусто — встроенный режим по path, без сервера.
    url: "${QDRANT_URL:-}"
    path: "${QDRANT_PATH:-memory/store/qdrant}"
    api_key_env: QDRANT_API_KEY
    collection_prefix: "sap_"
    timeout_s: 30

# --- Наблюдаемость ------------------------------------------------------------
observability:
  runs_dir: "observability/runs"
  max_field_chars: 800         # обрезка длинных полей в трассе
  console: true                # дублировать шаги в stdout
