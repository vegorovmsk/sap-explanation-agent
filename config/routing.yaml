# ============================================================================
# Data-driven роутинг: намерение → роль модели → обязательный набор источников.
#
# Правила детерминированы и читаются агентом, а не «зашиты» в промпт: выбранный
# маршрут пишется в трассу и проверяется метрикой «точность маршрута».
# ============================================================================

intents:
  GENERAL_LOGIC_EXPLANATION:
    описание: "Как в целом САП выбирает линии, строит блоки, считает переходы"
    role: M_balanced
    # Код обязателен, а не желателен. Вопрос «как система это делает» из одного
    # регламента не доказывается: регламент говорит, как ДОЛЖНО быть, и всякое
    # утверждение о поведении системы остаётся без опоры. Проверка ответа ловила
    # это верно — объяснение из одних норм не про систему, а про требования.
    required_sources: [regulations, code]
    optional_sources: [nsi, config]

  ORDER_LOOKUP:
    описание: >-
      Спрашивают, где стоит заказ: линия, время, этапы — и ничего больше.
      Подходит только если в вопросе нет ни слова о причинах и нет сомнения,
      что заказ в расписании есть
    role: M_fast
    required_sources: [plan]
    optional_sources: []
    key_entities: [order_number]

  ORDER_EQUIPMENT_EXPLANATION:
    описание: "Почему конкретный заказ на этой линии, а не на другой"
    role: M_balanced
    required_sources: [plan, task, nsi]
    optional_sources: [regulations, code]
    key_entities: [order_number]

  ORDER_POSITION_EXPLANATION:
    описание: "Почему заказ стоит в этом месте очереди, а не между соседями"
    role: M_balanced
    required_sources: [plan, nsi]
    optional_sources: [regulations, code]
    key_entities: [order_number]

  ORDER_DELAY_EXPLANATION:
    описание: >-
      Почему заказ готов ПОЗЖЕ желаемой даты, хотя в расписание попал. Случай
      «в расписание не попал вовсе» сюда не относится: это ограничение или дефект
      данных
    role: M_balanced
    required_sources: [plan, task]
    optional_sources: [nsi, regulations, code]
    key_entities: [order_number]

  CONSTRAINT_EXPLANATION:
    описание: >-
      Почему заказ исключён из расписания или почему сработало ограничение.
      Признаки: сказано, что заказа в расписании нет («куда делся», «почему его
      нет», «пропал», «не вижу»), назван код причины, служебный год готовности
      или служебная линия (их значения подставляются в промпт из конфига стенда),
      либо вопрос построен как «почему так, ХОТЯ …», «несмотря на …»
    # Реестра кодов в стенде нет намеренно: смысл выводится из кода валидации
    role: M_balanced
    # Задание в обязательных не случайно: ограничение всегда срабатывает на
    # параметрах заказа, а они лежат в задании. Без него объяснение повисает.
    required_sources: [plan, task, code, nsi]
    # Конфиг стенда: смысл служебного года и псевдо-линии написан там,
    # в комментарии над ключом, и оттуда его можно процитировать с координатой.
    optional_sources: [regulations, config]
    companion_role: M_code
    key_entities: [order_number]

  DATA_VALIDATION:
    описание: >-
      Есть ли дефект во входных данных или в НСИ: нет норматива, ключ записан иначе,
      значение выходит за допустимое. Сюда же вопросы про замечания НСИ — само
      замечание и есть признак дефекта данных
    role: M_balanced
    # Результат расчёта обязателен: именно в нём видно замечание НСИ, с которого
    # начинается разбор дефекта данных.
    required_sources: [task, plan, nsi, code]
    optional_sources: [logs, regulations, config]
    companion_role: M_code

  DOC_CODE_CONSISTENCY_CHECK:
    # Живой прогон показал, что именно этот класс труднее всего опознать: все три
    # кейса группы B ушли в другие классы, а вместе с ними — и нужные источники.
    # Поэтому в описании названы речевые признаки, а не только смысл.
    описание: >-
      Сверка документации с реализацией: что предписано нормой и что делает система.
      Сюда идут вопросы без номера заказа, где названа норма или её требование либо
      спрашивают про сам механизм расчёта: «регламент требует … так ли это сделано»,
      «учитывается ли …», «используется ли … при отборе линии», «правда ли, что система
      делает …». Проверяется регламент против кода, а не конкретный заказ
    role: M_reason
    required_sources: [regulations, code, nsi]
    optional_sources: [plan]
    companion_role: M_code

  NSI_PLAN_CONSISTENCY_CHECK:
    описание: >-
      Сверка результата расчёта с данными НСИ по конкретному заказу или линии:
      «соответствует ли <значение из расписания> нормативу <таблица НСИ>»,
      «сходится ли длительность с выработкой», «правильно ли посчитано для
      этого заказа». Признак — НАЗВАН КОНКРЕТНЫЙ ЗАКАЗ ИЛИ ЛИНИЯ и сверяется
      число, а не норма регламента и не механизм расчёта вообще
    role: M_reason
    required_sources: [plan, nsi]
    # Задание в необязательных: сверить расчётное значение с нормативом нельзя,
    # не зная входного — объём заказа лежит в задании, а не в расписании.
    optional_sources: [task, regulations, code]

  # Не класс вопроса пользователя, а внутренняя ветка: обращение в поддержку
  # готовится узлом ticket по вердикту сверки, а не по формулировке запроса.
  # Классификатору он не предлагается: источник «evidence» инструментов не даёт,
  # и выбери его модель — прогон выжег бы итерации без единого вызова.
  SUPPORT_TICKET_GENERATION:
    не_для_классификации: true
    описание: "Сформировать обращение в поддержку по найденному расхождению"
    role: M_balanced
    required_sources: [evidence]
    optional_sources: []

# --- Эскалация: когда маршрут повышается независимо от намерения ---------------
escalation:
  on_conflict:
    описание: "Источники разошлись — вердикт выносит только сильная модель"
    role: M_reason
  on_low_confidence:
    описание: "Уверенность ниже порога — перепроверка, затем честный отказ"
    role: M_reason
  verify_answer:
    описание: "Финальная проверка: каждое утверждение имеет координату источника"
    role: M_reason

# --- Соответствие источника инструменту ---------------------------------------
sources:
  task:        read_task
  plan:        read_plan
  nsi:         lookup_nsi
  regulations: search_regulations
  code:        search_code
  logs:        read_logs
  config:      read_stand_config
  evidence:    compare_sources
