# ============================================================================
# Золотой набор кейсов.
#
# Проверяется не красота текста, а обоснованность: тот ли выбран маршрут, те ли
# источники прочитаны, на что агент сослался и какой вынес статус. Для каждого
# кейса заданы обязательные источники, допустимые статусы, координаты, которые
# ОБЯЗАНЫ прозвучать, и утверждения, которых быть НЕ ДОЛЖНО — последнее ловит
# правдоподобные выдумки, а это главный риск объяснителя.
#
# Группы:
#   A — решение системы корректно, агент должен это доказать;
#   B — регламент и код расходятся, агент должен выйти на обращение в поддержку;
#   C — дефект данных, различимый только инструментом;
#   N — отрицательные кейсы: уточнение и честный отказ;
#   D — покрытие классов вопросов, не встречавшихся в A/B/C/N. Отдельная группа,
#       чтобы метрики по A/B/C/N оставались сравнимыми с прошлыми прогонами.
# ============================================================================

defaults:
  task_file: input_task_1.xlsx

cases:
  # ------------------------------------------------------ A. Решение корректно
  - id: A1
    группа: A
    вопрос: "Почему заказ Z-1060 не поставлен на линию ЛП2?"
    намерение: ORDER_EQUIPMENT_EXPLANATION
    источники: [plan, task, nsi]
    статус: [confirmed]
    обязательно_сослаться: ["табл. 18"]
    не_должно_прозвучать: ["ремонт", "профилактик", "занята", "перегруж"]
    комментарий: >
      Флагманский кейс. Флексо-4 допускается только на ЛП1 и ЛП3 (табл. 18),
      ЛП2 поддерживает Флексо-2 и Цифровую. Вопрос не утверждает, что заказ
      должен быть на ЛП2, — несовпадение ожиданий не конфликт.

  - id: A2
    группа: A
    вопрос: "Почему заказ Z-1010 не попал в расписание и стоит с годом 2070?"
    намерение: CONSTRAINT_EXPLANATION
    источники: [plan, code, nsi]
    статус: [confirmed]
    обязательно_сослаться: ["табл. 12"]
    не_должно_прозвучать: ["ошибка системы", "сбой", "баг"]
    комментарий: >
      Цветовой блок 5,4 км при нормативе 20 км для Синтекс Ск. Служебный год
      2070 означает «блок не набран», а не ошибку.

  - id: A3
    группа: A
    вопрос: "Почему заказ Z-1020 вообще не попал в план?"
    # Из самого вопроса класс однозначно не выводится: «не попал в план» — это и
    # дефект данных, и сработавшее ограничение, а различает их только чтение НСИ.
    # Оба класса ведут к одним источникам и одному ответу, поэтому допустимы оба.
    намерение: [DATA_VALIDATION, CONSTRAINT_EXPLANATION]
    источники: [task, nsi, code]
    статус: [confirmed, conflict]
    обязательно_сослаться: ["табл. 8"]
    не_должно_прозвучать: ["линия занята", "нет мощностей"]
    комментарий: >
      Калибр 120 вне диапазона стандартных толщин. Снят по блокирующему
      замечанию НСИ до оптимизации.

  - id: A4
    группа: A
    вопрос: "Куда делся заказ Z-1030, его нет в расписании?"
    намерение: CONSTRAINT_EXPLANATION
    источники: [plan, code]
    статус: [confirmed]
    обязательно_сослаться: ["Все_ПП"]
    не_должно_прозвучать: ["потерян", "удалён", "не существует"]
    комментарий: Исключён до оптимизации по группе ассортимента, линия «Отложенные», год 2099.

  - id: A5
    группа: A
    вопрос: "Почему заказ Z-1040 запущен, хотя блок не набран?"
    намерение: CONSTRAINT_EXPLANATION
    источники: [plan, code]
    статус: [confirmed]
    обязательно_сослаться: ["Все_ПП"]
    не_должно_прозвучать: ["случайно", "ошибочно"]
    комментарий: Жёсткий срок — не более 14 суток до даты готовности, ТР-ЭКС п. 3.4.

  - id: A6
    группа: A
    вопрос: "Где находится заказ Z-1001?"
    намерение: ORDER_LOOKUP
    источники: [plan]
    статус: [confirmed]
    обязательно_сослаться: ["Все_ПП"]
    не_должно_прозвучать: []
    маршрут_роль: M_fast
    комментарий: Простой поиск. Дорогие модели и векторная память подниматься не должны.

  - id: A7
    группа: A
    вопрос: "Почему заказ Z-1070 кольцуется именно на ЛК2?"
    намерение: ORDER_EQUIPMENT_EXPLANATION
    источники: [plan, task, nsi]
    статус: [confirmed]
    обязательно_сослаться: ["табл. 20"]
    не_должно_прозвучать: ["ЛК3", "ЛК4"]
    комментарий: Калибр 100 входит в диапазон 90–120 обеих линий, выбор — по загрузке.

  # ------------------------------------------ B. Регламент и код расходятся
  - id: B1
    группа: B
    вопрос: >
      Регламент требует переходить по калибру от большего к меньшему.
      Так ли это сделано в системе?
    намерение: DOC_CODE_CONSISTENCY_CHECK
    источники: [regulations, code]
    статус: [conflict]
    обязательно_сослаться: ["ТР-ЭКС", "extrusion.py"]
    не_должно_прозвучать: ["исправить код", "предлагаю изменить", "нужно переписать"]
    ожидается_обращение: true
    комментарий: >
      Расхождение D1. Пункт 4.3 предписывает переход от большего калибра к
      меньшему, сортировка идёт по возрастанию. Агент фиксирует расхождение,
      но не предлагает правок.

  - id: B2
    группа: B
    вопрос: "Учитывается ли диаметр кольца при отборе линии кольцевания?"
    намерение: DOC_CODE_CONSISTENCY_CHECK
    источники: [regulations, code]
    статус: [conflict, insufficient]
    обязательно_сослаться: ["ТР-КОЛ", "ringing.py"]
    не_должно_прозвучать: ["предлагаю изменить", "нужно переписать"]
    ожидается_обращение: true
    комментарий: >
      Расхождение D3. ТР-КОЛ п. 5.1 требует проверять калибр И диаметр кольца,
      отбор идёт только по калибру.

  - id: B3
    группа: B
    вопрос: "Используется ли калибровый блок из таблицы минимальных блоков?"
    намерение: DOC_CODE_CONSISTENCY_CHECK
    источники: [nsi, code]
    статус: [conflict, insufficient]
    обязательно_сослаться: ["табл. 12"]
    не_должно_прозвучать: ["предлагаю изменить"]
    ожидается_обращение: true
    комментарий: >
      Расхождение D5. «Блок 3, км» есть в таблице и в маппинге конфига,
      но в проверке готовности блока не участвует.

  # --------------------------------------- C. Видно только инструментом
  - id: C1
    группа: C
    вопрос: "Почему у заказа Z-1061 замечание НСИ по срокам хранения до печати?"
    намерение: DATA_VALIDATION
    источники: [plan, nsi]
    статус: [conflict, confirmed]
    обязательно_сослаться: ["табл. 29"]
    не_должно_прозвучать: ["норматив отсутствует в системе", "таблица не заполнена"]
    комментарий: >
      Гомоглиф: в табл. 29 тип записан латинской C (U+0043) вместо кириллической.
      Норматив есть, но ключ не находится. Ответ обязан говорить о символах,
      а не об отсутствии данных.

  # ------------------------------------------------------ N. Отрицательные
  - id: N1
    группа: N
    вопрос: "Почему заказ не туда встал?"
    намерение: null
    источники: []
    статус: [clarify]
    обязательно_сослаться: []
    не_должно_прозвучать: ["Z-", "линия"]
    комментарий: Нет номера заказа — агент обязан задать ровно один уточняющий вопрос.

  - id: N2
    группа: N
    вопрос: "Почему заказ Z-9999 не поставлен на линию ЛЭ1?"
    намерение: ORDER_EQUIPMENT_EXPLANATION
    источники: [task]
    статус: [insufficient]
    обязательно_сослаться: []
    не_должно_прозвучать: ["размещён", "поставлен на линию"]
    комментарий: Заказа нет в задании. Честный отказ вместо правдоподобной догадки.

  - id: N3
    группа: N
    задание: input_task_2.xlsx
    вопрос: "Где находится заказ B-3007 и есть ли по нему просрочка?"
    намерение: ORDER_LOOKUP
    источники: [plan]
    статус: [confirmed]
    обязательно_сослаться: ["Все_ПП"]
    не_должно_прозвучать: []
    комментарий: >
      Контрольное задание без подсаженных кейсов. Проверяет, что агент читает
      данные, а не воспроизводит выученные ответы по первому заданию.

  # ------------------------------------- D. Покрытие незакрытых классов вопросов
  # Группа добавлена после того, как подсчёт показал: классов вопросов десять, а
  # кейсами покрыто пять. Про остальные у агента не было данных ни за, ни против,
  # и в метриках это не отражалось никак. Группа отдельная намеренно — числа по
  # A/B/C/N остаются сравнимыми с прогонами 1–3.
  - id: D1
    группа: D
    вопрос: "Объясни действующие ограничения на экструзии"
    намерение: GENERAL_LOGIC_EXPLANATION
    источники: [regulations]
    статус: [confirmed]
    обязательно_сослаться: ["ТР-ЭКС"]
    не_должно_прозвучать: ["укажите номер заказа", "уточните заказ"]
    комментарий: >
      Вопрос об устройстве системы, а не о судьбе партии: номера заказа в нём нет
      и быть не может. Проверяет, что принудительное уточнение по ключевой
      сущности сюда не лезет, что маршрут ведёт в регламенты, и что узел
      stage_context собирает карту этапа «экструзия» (29 пунктов, 9 таблиц).

  - id: D2
    группа: D
    вопрос: "Почему заказ A-3063 готов позже желаемой даты?"
    намерение: ORDER_DELAY_EXPLANATION
    источники: [plan, task]
    статус: [confirmed]
    обязательно_сослаться: ["Все_ПП"]
    не_должно_прозвучать: ["ошибка системы", "сбой", "некорректно"]
    комментарий: >
      Желаемая дата 2026-07-06, расчётная 2026-07-19, опоздание 14 суток,
      причина «размещён» — то есть заказ размещён штатно, а опоздание вызвано
      загрузкой линии ЛЭ1, а не ограничением и не дефектом. Ответ обязан
      объяснить опоздание, не объявляя его ошибкой.

  - id: D3
    группа: D
    вопрос: "Почему заказ Z-1001 стоит на ЛЭ2 между Z-1060 и Z-1002?"
    намерение: ORDER_POSITION_EXPLANATION
    источники: [plan, nsi]
    статус: [confirmed]
    обязательно_сослаться: ["Все_ПП"]
    не_должно_прозвучать: ["приоритет заказа", "случайно"]
    комментарий: >
      Позиция 12 из 26 на ЛЭ2. Соседи: Z-1060 до (Лимонный) и Z-1002 после
      (Обсидиановый), все три Демолон Дк 60. Порядок задан сортировкой внутри
      блока по калибру и цвету (ExtrusionStage._place_group), а не приоритетом.
      Единственный кейс, который проверяет извлечение сущностей left_neighbor и
      right_neighbor и инструмент соседей по очереди.

  - id: D4
    группа: D
    вопрос: "Соответствует ли длительность экструзии заказа Z-1001 нормативу выработки для линии ЛЭ2?"
    намерение: NSI_PLAN_CONSISTENCY_CHECK
    источники: [plan, nsi, task]
    статус: [confirmed]
    обязательно_сослаться: ["табл. 1", "табл. 7"]
    не_должно_прозвучать: ["расхождение", "не соответствует"]
    комментарий: >
      Цепочку задаёт ТР-ЭКС п. 5.4: «плановую длительность экструзии определять
      как отношение длины заказа (приложение 9) к нормативу выработки линии
      (приложение 1)». В стенде это: заказанное количество 500 (задание)
      × длина намотки 50 м (табл. 7, Демолон Дк 60) / 1000 = 25 км;
      25 / 6.0 км-час (табл. 1, ЛЭ2 Демолон Дк 60) = 4.17 ч — ровно столько и
      стоит в расписании. Ответ обязан назвать обе таблицы. Табл. 7 не
      участвует больше ни в одном кейсе.

  - id: D5
    группа: D
    вопрос: "По заказу Z-1061 в журнале расчёта есть замечание НСИ — что оно означает?"
    намерение: DATA_VALIDATION
    источники: [logs, nsi]
    статус: [conflict, confirmed]
    обязательно_сослаться: ["demo_input_task_1.log"]
    не_должно_прозвучать: ["норматива нет", "данные отсутствуют"]
    комментарий: >
      Журнал, строка 7: «ЗАМЕЧАНИЕ НСИ Z-1061: печать, таблица 29, ключ
      вид=Синтекс, тип=Ск». Тот же гомоглиф, что в C1, но заходить сюда надо
      через журнал: единственный кейс, поднимающий read_logs. Норматив в табл. 29
      ЕСТЬ, не находится только ключ — поэтому «норматива нет» запрещено.
