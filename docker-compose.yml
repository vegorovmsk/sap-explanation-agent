# Локальный Qdrant для векторной памяти агента.
#
#   docker compose up -d qdrant
#   python -m memory.build           # QDRANT_URL=http://localhost:6333 в .env
#
# Сервер нужен не всегда: без него агент работает во встроенном режиме
# (QDRANT_URL пустой), но тогда Qdrant не создаёт индексы по payload —
# на корпусе в сотни фрагментов разница незаметна, на тысячах уже нет.
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: sap-agent-qdrant
    ports:
      - "6333:6333"     # REST и веб-панель: http://localhost:6333/dashboard
      - "6334:6334"     # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
